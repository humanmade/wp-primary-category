name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer

      - name: Install PHP dependencies
        run: composer install --no-progress --no-interaction --no-ansi

      - name: Lint
        run: composer lint

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      # No database service needed — Playground boots its own ephemeral,
      # SQLite-backed WordPress.
      - name: Test
        run: npm test
